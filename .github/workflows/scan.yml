name: Bybit Futures Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: futures-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan official public Bybit futures
        run: python scanner.py
      - name: Publish latest results to GitHub Pages source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published Bybit futures scan [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-scan-${{ github.run_id }}
          path: output/latest.json
          if-no-files-found: warn
          retention-days: 7
