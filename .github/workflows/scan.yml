name: Bybit Futures Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public Bybit futures
        run: python scanner.py
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-scan-${{ github.run_id }}
          path: output/latest.json
          if-no-files-found: warn
          retention-days: 7
