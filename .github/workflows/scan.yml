name: Bybit Futures Scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check docs/scanner.js && node --test tests/scanner.test.cjs
      - run: python -m py_compile scanner.py

  scan:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan official public Bybit futures
        run: python scanner.py
      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-scan-${{ github.run_id }}
          path: output/latest.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify scan status
        run: |
          python - <<'PY'
          import json
          with open('output/latest.json', encoding='utf-8') as f:
              data = json.load(f)
          if data['scan_status'] != 'OK':
              raise SystemExit(f"Bybit market scan incomplete: {data['scan_status']}. See scan artifact.")
          PY
